apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-kafka
  labels:
    app: atlas-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlas-kafka
  template:
    metadata:
      labels:
        app: atlas-kafka
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:latest
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://atlas-kafka:9092
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: atlas-zookeeper:2181
          ports:
            - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-kafka-service
spec:
  selector:
    app: atlas-kafka
  ports:
    - protocol: TCP
      port: 9092
      targetPort: 9092
  type: ClusterIP

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "atlas-sanctum"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cloudflare-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["cloudflare-worker:9100"]

  - job_name: "postgres"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["postgres-exporter:9187"]

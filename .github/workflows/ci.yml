name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run generate
      - name: TypeScript typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bunx vitest run
      - name: Build
        run: bun run build
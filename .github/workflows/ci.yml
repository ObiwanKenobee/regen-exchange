name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock') }}
      - name: Cache Prisma client
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: ${{ runner.os }}-prisma-${{ hashFiles('prisma/schema.prisma') }}
      - name: Cache Vite + Vitest
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
          key: ${{ runner.os }}-vite-${{ hashFiles('vite.config.ts', 'vitest.config.ts', 'bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run generate
      - name: TypeScript typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bunx vitest run
      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock') }}
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run generate
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build app
        run: bun run build
      - name: Run Playwright E2E tests
        run: bun run test:e2e
      # Generate a single artifact index (JSON + HTML) covering every
      # attached diagnostic — runs on pass and fail so green CI still
      # surfaces perf-summary / SSE timeline / correlation logs for
      # regression triage without opening the full HTML report.
      - name: Build artifact index
        if: always()
        run: bun run scripts/build-artifact-index.ts test-results playwright-report
      # Print the resolved path to the artifact index plus the key
      # diagnostic filenames per test so engineers can jump straight from
      # the CI log to the attachment they need without opening the full
      # HTML report.
      - name: Print artifact index summary
        if: always()
        run: |
          echo "::group::Playwright artifact index"
          INDEX="playwright-report/artifact-index.html"
          INDEX_JSON="playwright-report/artifact-index.json"
          if [ -f "$INDEX" ]; then
            echo "Artifact index (HTML): $GITHUB_WORKSPACE/$INDEX"
            echo "Artifact index (JSON): $GITHUB_WORKSPACE/$INDEX_JSON"
          else
            echo "No artifact index produced (no test-results found)."
          fi
          if [ -f "$INDEX_JSON" ]; then
            echo ""
            echo "Key attachments per test:"
            bunx --bun node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const KEY = new Set(["perf-summary","sse-timeline","correlation-log"]);
              for (const [test, items] of Object.entries(data.byTest)) {
                console.log("• " + test);
                for (const i of items) {
                  if (KEY.has(i.kind)) console.log("    [" + i.kind + "] " + i.path);
                }
              }
            ' "$INDEX_JSON"
          fi
          echo "::endgroup::"
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14
      # Always upload per-attempt artifacts (HAR, trace, video, screenshots)
      # using the same `<file>__<title>__attempt<N>.<ext>` naming the
      # fixtures emit, so failing attempts are easy to correlate.
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/*.zip
            test-results/**/*__attempt*.zip
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Playwright videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/*.webm
            test-results/**/*__attempt*.webm
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/*.png
            test-results/**/*__attempt*.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Playwright HAR files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-har-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/*.har
            test-results/**/*__attempt*.har
          retention-days: 14
          if-no-files-found: ignore
      # Always upload SSE timeline + perf-summary diagnostics (attached by
      # tests via testInfo.attach regardless of pass/fail) so regressions
      # can be diffed across runs without opening the HTML report.
      - name: Upload Playwright diagnostics (perf/SSE)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/perf-summary.json
            test-results/**/sse-seq-gap-timeline.json
            test-results/**/correlation-id-propagation.txt
          retention-days: 14
          if-no-files-found: ignore